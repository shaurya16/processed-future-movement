x-topic: &pfm-topic future-transactions

services:
  kafka:
    image: apache/kafka:3.9.2
    hostname: broker
    container_name: pfm-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    image: pfm/ingestion-service:local
    container_name: pfm-ingestion-service
    ports:
      - '8081:8081'
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 'broker:19092'
      PFM_TOPIC: *pfm-topic
      # Overridable so a generated fixture can be ingested without editing this
      # file; sample-data/ is already mounted, so any path under it resolves.
      #
      # The host-side knob is deliberately NOT called INGESTION_FILE_PATH. That
      # name belongs to the service itself, and ingestion-service/README.md tells
      # you to export it as a *host* path for the `mvn spring-boot:run` dev loop.
      # Reusing it here would let an exported dev-loop value leak in and resolve
      # to a path that does not exist inside the container.
      INGESTION_FILE_PATH: ${PFM_INPUT_FILE:-/app/sample-data/Input.txt}
    volumes:
      # Shadows the sample-data/ copy baked into the image, so the host file can be
      # swapped for your own without rebuilding. Read-only: the service only reads it.
      - ./sample-data:/app/sample-data:ro
    depends_on:
      kafka:
        condition: service_healthy

  wait-for-topic:
    image: apache/kafka:3.9.2
    container_name: pfm-wait-for-topic
    environment:
      PFM_TOPIC: *pfm-topic
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list | grep -qxF "$$PFM_TOPIC"; do
          echo "waiting for $$PFM_TOPIC topic..."
          sleep 2
        done
        echo "$$PFM_TOPIC topic found, starting processing-service"

  processing-service:
    build:
      context: .
      dockerfile: processing-service/Dockerfile
    image: pfm/processing-service:local
    container_name: pfm-processing-service
    ports:
      - '8082:8082'
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 'broker:19092'
      PFM_TOPIC: *pfm-topic
    depends_on:
      wait-for-topic:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
    image: pfm/frontend:local
    container_name: pfm-frontend
    ports:
      - '8080:80'
    environment:
      PROCESSING_SERVICE_UPSTREAM: 'http://processing-service:8082'
      INGESTION_SERVICE_UPSTREAM: 'http://ingestion-service:8081'
    depends_on:
      - processing-service
