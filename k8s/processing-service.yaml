apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service
  namespace: pfm
  labels:
    app: processing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
    spec:
      initContainers:
        - name: wait-for-topic
          image: apache/kafka:3.9.2
          command:
            - sh
            - -c
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list | grep -qx future-transactions; do
                echo "waiting for future-transactions topic..."
                sleep 2
              done
              echo "future-transactions topic found, starting processing-service"
      containers:
        - name: processing-service
          image: pfm/processing-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: processing-service
  namespace: pfm
spec:
  selector:
    app: processing-service
  ports:
    - port: 8082
      targetPort: 8082
