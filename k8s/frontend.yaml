apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pfm
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: pfm/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: PROCESSING_SERVICE_UPSTREAM
              value: "http://processing-service.pfm.svc.cluster.local:8082"
            - name: INGESTION_SERVICE_UPSTREAM
              value: "http://ingestion-service:8081"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pfm
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
