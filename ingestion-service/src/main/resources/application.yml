server:
  port: 8081

spring:
  application:
    name: ingestion-service
  config:
    import: classpath:pfm-defaults.yml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

ingestion:
  file-path: ${INGESTION_FILE_PATH:sample-data/Input.txt}
  topic: ${pfm.topic}

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
