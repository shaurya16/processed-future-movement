name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn clean verify
        # ingestion-service/pom.xml and processing-service/pom.xml pin
        # testcontainers.docker.api.version=1.51 for Testcontainers' Docker API
        # negotiation, tuned for local Docker Desktop (see that property's comment
        # in ingestion-service/pom.xml for the full story). GitHub-hosted runners use
        # a plain Linux Docker Engine with a different supported API range, so forcing
        # 1.51 here makes every Testcontainers connection attempt fail with
        # "Could not find a valid Docker environment". Clearing the property lets
        # Testcontainers auto-negotiate against the runner's actual engine instead,
        # exactly as documented in that pom.xml comment's override instructions.
        run: mvn -B clean verify -Dtestcontainers.docker.api.version=

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: |
          docker build -f ingestion-service/Dockerfile -t pfm/ingestion-service:local .
          docker build -f processing-service/Dockerfile -t pfm/processing-service:local .
          docker build -t pfm/frontend:local frontend/
      - name: Create kind cluster
        # Deliberately not helm/kind-action. Through v1.14.0 its install_kind
        # fetches the kind binary and its .sha256sum with plain `curl -sSLo`
        # (no --fail, no --retry). A transient download failure leaves an HTTP
        # error body or an empty file in place of the checksum and curl still
        # exits 0, so the follow-up `grep ... | sha256sum -c` gets empty stdin
        # and dies with "no properly formatted checksum lines found" — an
        # intermittent, misleading failure we hit more than once. Upstream has
        # since added curl --retry on main, but that is unreleased.
        #
        # The ubuntu-24.04 runner image (what ubuntu-latest points at) already
        # ships kind and kubectl, so we skip the download entirely rather than
        # retrying around it. The node image is pinned so manifest validation
        # keeps running against a fixed API version even as the runner image
        # bumps its bundled kind; if a future image drops kind, this fails
        # loudly with "kind: command not found" instead of a checksum riddle.
        run: kind create cluster --name pfm --image kindest/node:v1.36.1 --wait 60s
      - name: Validate manifests
        # kubectl apply --dry-run=client still needs a reachable API server for
        # resource-kind discovery, so this runs against the throwaway kind cluster
        # above rather than truly offline.
        run: kubectl apply --dry-run=client -f k8s/
